name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  bot-test:
    name: Bot — test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # DB TEST (waguri-test) — KHÔNG BAO GIỜ trỏ vào prod.
      # Thiếu secret -> integration test tự SKIP (mặc định an toàn), CI vẫn chạy.
      # Có secret -> ĐÁNH THỨC 24 test tích hợp/race (đo thật 2026-08-13: 114 -> 138 test).
      # Chúng đã được viết sẵn từ lâu nhưng chưa từng chạy trong CI, vì CI dùng URL dummy —
      # đó là lý do tầng DB (nơi chứa 100% lỗi nghiêm trọng của sự cố chợ 2026-08) không có
      # một gate tự động nào.
      - run: npm test
        env:
          SUPABASE_URL: https://dummy.supabase.co
          SUPABASE_SERVICE_KEY: dummy_key_for_ci
          ENABLE_TEST_SUPABASE: ${{ secrets.TEST_SUPABASE_URL != '' && 'true' || '' }}
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_SERVICE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_KEY }}
      # Gate tầng DB: nguyên tử (FOR UPDATE), least-privilege (không GRANT cho anon),
      # idempotent, số migration không trùng. Ratchet qua scripts/sql-policy-allowlist.json.
      - run: npm run check-sql
      # Chặn khoảng hở RPC↔lệnh: migration thêm status trả về mới mà lệnh chưa biết
      # -> lệnh rơi xuống nhánh thành công hoặc kết thúc không ack (lỗi bad_qty / no_user).
      - run: npm run check-rpc
      # Chặn drift: mọi lệnh slash của bot phải có trên trang commands của web.
      - run: node scripts/check-command-sync.js
      # Nửa còn lại của Luật 7: gate trên chỉ soi bot↔web. /help dùng danh sách gõ tay nên
      # đã trôi mất 11 lệnh (gồm /start, /study, /prestige) — /study và /ticket có 0 lượt
      # dùng trên prod vì người chơi không có đường nào khám phá ra chúng.
      - run: node scripts/check-help-sync.js
      # "Viết migration" KHÁC "DB đã có" — đã xảy ra BA lần: 0096 (chợ bán mọi thứ 500 xu),
      # 0080 (ghi nhớ ngôn ngữ chết), 0091 (tuyên chiến clan mất cooldown). Cả ba đều do
      # TRÙNG SỐ HIỆU nên file không bao giờ được áp.
      # Chạy OFFLINE: đối chiếu file .sql với supabase/schema-snapshot.json đã commit.
      # KHÔNG cần khoá DB nào — khoá service-role của prod không bao giờ rời máy local, vì
      # `npm ci` cài 231 package và bất kỳ package nào cũng đọc được biến môi trường của job.
      - run: node scripts/check-db-applied.js
      # So DB test với ảnh chụp prod. Chỉ cần khoá TEST (đã có sẵn ở bước npm test phía trên);
      # thiếu secret thì tự bỏ qua, mặc định an toàn.
      - run: node scripts/check-db-drift.js
        env:
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_SERVICE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_KEY }}

  web-build:
    name: Web — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      # npm install (không phải ci): né bug lockfile optional-deps đa nền tảng của Tailwind v4/oxide-emnapi.
      - run: npm install --no-audit --no-fund
      # build là cổng chính (không cần secret — trang động render lúc request).
      - run: npm run build
      # lint đã sạch (0 errors) -> gate chặn thật.
      - run: npm run lint
